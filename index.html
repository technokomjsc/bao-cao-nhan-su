<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1e3a8a">
<title>Báo cáo nhân sự ca đêm</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --primary:#1e3a8a; --primary-2:#2563eb; --ok:#15803d; --warn:#b45309; --err:#b91c1c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px}
  header{position:sticky;top:0;z-index:5;background:var(--primary);color:#fff;padding:14px 16px 12px}
  header h1{margin:0;font-size:18px;letter-spacing:.3px}
  header .date{font-size:13px;opacity:.85;margin-top:2px}
  .crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:13px}
  .crumb{background:rgba(255,255,255,.15);padding:3px 10px;border-radius:999px}
  main{padding:16px;max-width:560px;margin:0 auto;padding-bottom:110px}
  .step-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:4px 0 10px}
  .list{display:grid;gap:10px}
  .item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
        background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
        font-size:17px;font-weight:600;color:var(--text);text-align:left;cursor:pointer}
  .item:active{background:#eef2ff;border-color:var(--primary-2)}
  .item small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:3px}
  .badge{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:#f1f5f9;color:var(--muted);white-space:nowrap}
  .badge.has{background:#fef3c7;color:var(--warn)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
  .stats b{display:block;font-size:22px}
  .stats span{font-size:12px;color:var(--muted)}
  .reason{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
  .reason:first-child{border-top:0}
  .reason label{font-weight:600;font-size:15px}
  .reason .cur{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
  .reason .cur.changed{color:var(--primary-2);font-weight:600}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex-shrink:0}
  .stepper button{width:44px;height:46px;border:0;background:#f8fafc;font-size:22px;color:var(--primary);cursor:pointer}
  .stepper button:active{background:#e0e7ff}
  .stepper input{width:56px;height:46px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);
                 text-align:center;font-size:20px;font-weight:700;color:var(--text);outline:none}
  .stepper input:focus{background:#eef2ff}
  .sum{display:flex;justify-content:space-between;font-weight:700;padding-top:10px;border-top:2px solid var(--line);margin-top:4px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .bar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
  .btn{flex:1;height:52px;border-radius:12px;border:0;font-size:17px;font-weight:700;cursor:pointer}
  .btn.primary{background:var(--primary-2);color:#fff}
  .btn.primary:disabled{background:#93c5fd}
  .btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--line);flex:0 0 auto;padding:0 18px}
  .msg{padding:12px 14px;border-radius:12px;margin-bottom:12px;font-size:14px}
  .msg.err{background:#fef2f2;color:var(--err);border:1px solid #fecaca}
  .msg.warn{background:#fffbeb;color:var(--warn);border:1px solid #fde68a}
  .center{text-align:center;padding:40px 10px;color:var(--muted)}
  .spinner{width:34px;height:34px;border:4px solid #cbd5e1;border-top-color:var(--primary-2);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .done{text-align:center;padding:24px 8px}
  .done .tick{width:72px;height:72px;border-radius:50%;background:#dcfce7;color:var(--ok);font-size:40px;line-height:72px;margin:0 auto 12px}
  .done h2{margin:0 0 6px;font-size:20px}
  .done p{margin:0;color:var(--muted)}
  .hidden{display:none!important}
</style>
</head>
<body>

<header>
  <h1>BÁO CÁO NHÂN SỰ CA ĐÊM</h1>
  <div class="date" id="today"></div>
  <div class="crumbs" id="crumbs"></div>
</header>

<main id="app">
  <div class="center"><div class="spinner"></div>Đang tải dữ liệu...</div>
</main>

<div class="bar hidden" id="bar"><div class="inner" id="barInner"></div></div>

<script>
/* ====== CẤU HÌNH: dán URL Web App của Apps Script vào đây ====== */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby3NJFBmWjy5LRBMQKZ8rD1Px7hGysKdpWuSVgvpUxXywswlHXdzWHpdwUffxlH8cay/exec';
/* =============================================================== */

const state = { data: null, factory: null, dept: null, inputs: [], saving: false };
const $app = document.getElementById('app');
const $bar = document.getElementById('bar');
const $barInner = document.getElementById('barInner');
const $crumbs = document.getElementById('crumbs');

document.getElementById('today').textContent =
  new Date().toLocaleDateString('vi-VN', { weekday:'long', day:'2-digit', month:'2-digit', year:'numeric' });

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = arr => arr.reduce((a, b) => a + (Number(b) || 0), 0);

/* ---------- API ---------- */
async function apiGet() {
  const res = await fetch(SCRIPT_URL + '?t=' + Date.now());
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}
async function apiPost(payload) {
  // text/plain để tránh CORS preflight với Apps Script
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

/* ---------- Điều hướng ---------- */
function setCrumbs() {
  const parts = [];
  if (state.factory) parts.push(state.factory.name);
  if (state.dept) parts.push(state.dept.name);
  $crumbs.innerHTML = parts.map(p => `<span class="crumb">${esc(p)}</span>`).join('');
}
function setBar(html) {
  if (!html) { $bar.classList.add('hidden'); $barInner.innerHTML = ''; return; }
  $barInner.innerHTML = html; $bar.classList.remove('hidden');
}
function showLoading(text) {
  setBar('');
  $app.innerHTML = `<div class="center"><div class="spinner"></div>${esc(text)}</div>`;
}
function showError(err, retry) {
  $app.innerHTML = `<div class="msg err">${esc(err.message || err)}</div>
    <button class="btn primary" style="width:100%" id="retry">Thử lại</button>`;
  setBar('');
  document.getElementById('retry').onclick = retry;
}

async function load() {
  showLoading('Đang tải dữ liệu...');
  try {
    state.data = await apiGet();
    // Giữ lựa chọn hiện tại sau khi tải lại
    if (state.factory) state.factory = state.data.factories.find(f => f.name === state.factory.name) || null;
    if (state.dept && state.factory) state.dept = state.factory.departments.find(d => d.name === state.dept.name) || null;
    if (state.dept) return renderForm();
    if (state.factory) return renderDepartments();
    renderFactories();
  } catch (e) {
    showError(e, load);
  }
}

/* ---------- Bước 1: Chọn Nhà máy ---------- */
function renderFactories() {
  state.factory = null; state.dept = null; setCrumbs();
  const f = state.data.factories;
  $app.innerHTML = `
    <div class="step-title">Bước 1 · Chọn xưởng</div>
    <div class="list">
      ${f.map((x, i) => {
        const absent = sum(x.departments.map(d => sum(d.values)));
        return `<button class="item" data-i="${i}">
          <div>${esc(x.name)}<small>${x.departments.length} bộ phận</small></div>
          <span class="badge ${absent ? 'has' : ''}">${absent} người nghỉ</span>
        </button>`;
      }).join('')}
    </div>`;
  $app.querySelectorAll('.item').forEach(b => b.onclick = () => {
    state.factory = f[b.dataset.i]; renderDepartments();
  });
  setBar(`<button class="btn ghost" style="flex:1" id="reload">↻ Tải lại số liệu</button>`);
  document.getElementById('reload').onclick = load;
  window.scrollTo(0, 0);
}

/* ---------- Bước 2: Chọn Bộ phận ---------- */
function renderDepartments() {
  state.dept = null; setCrumbs();
  const d = state.factory.departments;
  $app.innerHTML = `
    <div class="step-title">Bước 2 · Chọn bộ phận</div>
    <div class="list">
      ${d.map((x, i) => {
        const absent = sum(x.values);
        return `<button class="item" data-i="${i}">
          <div>${esc(x.name)}<small>NS hiện có: ${x.total}</small></div>
          <span class="badge ${absent ? 'has' : ''}">${absent ? absent + ' người' : 'Chưa có'}</span>
        </button>`;
      }).join('')}
    </div>`;
  $app.querySelectorAll('.item').forEach(b => b.onclick = () => {
    state.dept = d[b.dataset.i]; renderForm();
  });
  setBar(`<button class="btn ghost" style="flex:1" id="back">← Chọn lại xưởng</button>`);
  document.getElementById('back').onclick = renderFactories;
  window.scrollTo(0, 0);
}

/* ---------- Bước 3: Nhập số người nghỉ ---------- */
function renderForm(errorText) {
  setCrumbs();
  const d = state.dept;
  const reasons = state.data.reasons;
  state.inputs = d.values.slice();

  $app.innerHTML = `
    <div class="step-title">Bước 3 · Nhập số người nghỉ theo lý do</div>
    ${errorText ? `<div class="msg err">${esc(errorText)}</div>` : ''}
    <div class="card stats">
      <div><b>${d.total}</b><span>NS hiện có</span></div>
      <div><b>${d.present}</b><span>Đi làm</span></div>
      <div><b>${sum(d.values)}</b><span>Đã báo nghỉ</span></div>
    </div>
    <div id="warn"></div>
    <div class="card">
      ${reasons.map((r, i) => `
        <div class="reason">
          <label for="in${i}">${esc(r)}
            <span class="cur" id="cur${i}">Hiện tại: ${d.values[i]}</span>
          </label>
          <div class="stepper">
            <button type="button" data-i="${i}" data-d="-1" aria-label="Giảm">−</button>
            <input id="in${i}" data-i="${i}" type="text" inputmode="numeric" pattern="[0-9]*"
                   autocomplete="off" value="${d.values[i]}">
            <button type="button" data-i="${i}" data-d="1" aria-label="Tăng">+</button>
          </div>
        </div>`).join('')}
      <div class="sum"><span>Tổng số người</span><span id="total">${sum(d.values)}</span></div>
    </div>`;

  $app.querySelectorAll('.stepper button').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    setValue(i, (state.inputs[i] || 0) + (+b.dataset.d));
  });
  $app.querySelectorAll('.stepper input').forEach(inp => {
    inp.addEventListener('focus', () => inp.select());
    inp.addEventListener('input', () => {
      const digits = inp.value.replace(/\D/g, '').slice(0, 3);
      inp.value = digits;
      state.inputs[+inp.dataset.i] = digits === '' ? 0 : parseInt(digits, 10);
      refresh();
    });
    inp.addEventListener('blur', () => { inp.value = state.inputs[+inp.dataset.i]; });
  });

  setBar(`<button class="btn ghost" id="back">←</button>
          <button class="btn primary" id="send">Gửi báo cáo</button>`);
  document.getElementById('back').onclick = renderDepartments;
  document.getElementById('send').onclick = submit;
  refresh();
  window.scrollTo(0, 0);
}

function setValue(i, v) {
  v = Math.max(0, Math.min(999, v | 0));
  state.inputs[i] = v;
  document.getElementById('in' + i).value = v;
  refresh();
}

function refresh() {
  const d = state.dept;
  const total = sum(state.inputs);
  document.getElementById('total').textContent = total;
  state.inputs.forEach((v, i) => {
    document.getElementById('cur' + i).classList.toggle('changed', v !== d.values[i]);
  });
  const warn = document.getElementById('warn');
  warn.innerHTML = total > d.total
    ? `<div class="msg warn">Tổng số người (${total}) lớn hơn nhân sự hiện có (${d.total}). Vui lòng kiểm tra lại.</div>`
    : '';
}

async function submit() {
  if (state.saving) return;
  const d = state.dept;
  const reasons = state.data.reasons;
  const total = sum(state.inputs);
  const lines = reasons.map((r, i) => `• ${r}: ${state.inputs[i]}`).join('\n');
  let msg = `Gửi báo cáo cho ${state.factory.name} - ${d.name}?\n\n${lines}\n\nTổng: ${total} người`;
  if (sum(d.values) > 0) msg += `\n\n(Số liệu cũ sẽ bị ghi đè)`;
  if (total > d.total) msg += `\n\n⚠ Tổng lớn hơn NS hiện có (${d.total})`;
  if (!confirm(msg)) return;

  state.saving = true;
  const btn = document.getElementById('send');
  btn.disabled = true; btn.textContent = 'Đang gửi...';
  try {
    const updated = await apiPost({
      factory: state.factory.name,
      department: d.name,
      values: state.inputs
    });
    // Cập nhật số liệu cục bộ
    const idx = state.factory.departments.findIndex(x => x.name === d.name);
    if (idx >= 0 && updated) state.factory.departments[idx] = updated;
    renderDone(updated || d);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Gửi báo cáo';
    alert('Gửi không thành công:\n' + (e.message || e));
  } finally {
    state.saving = false;
  }
}

/* ---------- Hoàn tất ---------- */
function renderDone(d) {
  const reasons = state.data.reasons;
  const time = new Date().toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit' });
  $app.innerHTML = `
    <div class="done">
      <div class="tick">✓</div>
      <h2>Đã gửi thành công</h2>
      <p>${esc(state.factory.name)} · ${esc(d.name)} · ${time}</p>
    </div>
    <div class="card">
      ${reasons.map((r, i) => `<div class="reason"><span>${esc(r)}</span><b>${d.values[i]}</b></div>`).join('')}
      <div class="sum"><span>Tổng số người</span><span>${sum(d.values)}</span></div>
    </div>
    <div class="card stats">
      <div><b>${d.total}</b><span>NS hiện có</span></div>
      <div><b>${d.present}</b><span>Đi làm</span></div>
      <div><b>${d.absent}</b><span>Nghỉ trong ngày</span></div>
    </div>`;
  setBar(`<button class="btn ghost" id="home">Về đầu</button>
          <button class="btn primary" id="other">Bộ phận khác</button>`);
  document.getElementById('home').onclick = renderFactories;
  document.getElementById('other').onclick = renderDepartments;
  window.scrollTo(0, 0);
}

load();
</script>
</body>
</html>
