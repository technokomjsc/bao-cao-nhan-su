<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1e3a8a">
<title>Báo cáo Technokom</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --primary:#1e3a8a; --primary-2:#2563eb; --ok:#15803d; --ok-bg:#dcfce7;
    --warn:#b45309; --warn-bg:#fef3c7; --err:#b91c1c; --err-bg:#fee2e2;
    --bread:#9a3412; --bread-2:#ea580c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px}
  header{position:sticky;top:0;z-index:5;background:var(--primary);color:#fff;padding:14px 16px 12px;transition:background .2s}
  header.bread{background:var(--bread)}
  header h1{margin:0;font-size:18px;letter-spacing:.3px}
  header .date{font-size:13px;opacity:.85;margin-top:2px}
  .crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:13px}
  .crumbs:empty{display:none}
  .crumb{background:rgba(255,255,255,.15);padding:3px 10px;border-radius:999px}
  main{padding:16px;max-width:560px;margin:0 auto;padding-bottom:110px}
  .step-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:4px 0 10px}
  .list{display:grid;gap:10px}
  .item{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
        background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;
        font-size:17px;font-weight:600;color:var(--text);text-align:left;cursor:pointer;font-family:inherit}
  .item:active{background:#eef2ff;border-color:var(--primary-2)}
  .item small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:3px}
  .badge{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:#f1f5f9;color:var(--muted);white-space:nowrap}
  .badge.has{background:var(--warn-bg);color:var(--warn)}
  .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .badge.no{background:var(--err-bg);color:var(--err)}

  /* Menu chính */
  .menu{display:grid;gap:14px;margin-top:6px}
  .menu-btn{display:flex;align-items:center;gap:14px;width:100%;padding:20px 18px;border-radius:16px;border:0;
            color:#fff;text-align:left;cursor:pointer;font-family:inherit}
  .menu-btn.night{background:linear-gradient(135deg,#1e3a8a,#2563eb)}
  .menu-btn.bread{background:linear-gradient(135deg,#9a3412,#ea580c)}
  .menu-btn:active{opacity:.9;transform:scale(.99)}
  .menu-btn .ic{font-size:34px;line-height:1}
  .menu-btn b{display:block;font-size:18px}
  .menu-btn span{display:block;font-size:13px;opacity:.9;margin-top:3px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
  .stats b{display:block;font-size:22px}
  .stats span{font-size:12px;color:var(--muted)}
  .reason{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
  .reason:first-child{border-top:0}
  .reason label{font-weight:600;font-size:15px}
  .reason .cur{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
  .reason .cur.changed{color:var(--primary-2);font-weight:600}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex-shrink:0}
  .stepper button{width:44px;height:46px;border:0;background:#f8fafc;font-size:22px;color:var(--primary);cursor:pointer}
  .stepper button:active{background:#e0e7ff}
  .stepper input{width:56px;height:46px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);
                 text-align:center;font-size:20px;font-weight:700;color:var(--text);outline:none;font-family:inherit}
  .stepper input:focus{background:#eef2ff}
  .stepper.big button{width:64px;height:64px;font-size:28px;color:var(--bread)}
  .stepper.big input{width:110px;height:64px;font-size:30px}
  .bread-input{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px 0 6px}
  .bread-input .lbl{font-weight:600}
  .bread-input .cur{font-size:13px;color:var(--muted)}
  .sum{display:flex;justify-content:space-between;font-weight:700;padding-top:10px;border-top:2px solid var(--line);margin-top:4px}

  /* Bảng tình hình khai báo */
  .status-head{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
  .status-head .step-title{margin:0}
  .status-head small{color:var(--muted);font-size:13px}
  .progress{height:8px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-bottom:12px}
  .progress i{display:block;height:100%;background:var(--ok);border-radius:999px}
  table.st{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  table.st th,table.st td{padding:10px 8px;text-align:left;border-top:1px solid var(--line)}
  table.st thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;background:#f8fafc}
  table.st .num{text-align:right;font-variant-numeric:tabular-nums}
  table.st .c{text-align:center}
  table.st tr.grp td{background:#f8fafc;font-weight:700;font-size:13px;color:var(--bread)}
  table.st tr.tot td{font-weight:700;border-top:2px solid var(--line)}
  table.st td.muted{color:var(--muted)}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .pill.no{background:var(--err-bg);color:var(--err)}

  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .bar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
  .btn{flex:1;height:52px;border-radius:12px;border:0;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--primary-2);color:#fff}
  .btn.primary.bread{background:var(--bread-2)}
  .btn.primary:disabled{opacity:.5}
  .btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--line);flex:0 0 auto;padding:0 18px}
  .msg{padding:12px 14px;border-radius:12px;margin-bottom:12px;font-size:14px}
  .msg.err{background:#fef2f2;color:var(--err);border:1px solid #fecaca}
  .msg.warn{background:#fffbeb;color:var(--warn);border:1px solid #fde68a}
  .center{text-align:center;padding:40px 10px;color:var(--muted)}
  .spinner{width:34px;height:34px;border:4px solid #cbd5e1;border-top-color:var(--primary-2);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .done{text-align:center;padding:24px 8px}
  .done .tick{width:72px;height:72px;border-radius:50%;background:var(--ok-bg);color:var(--ok);font-size:40px;line-height:72px;margin:0 auto 12px}
  .done h2{margin:0 0 6px;font-size:20px}
  .done p{margin:0;color:var(--muted)}
  .hidden{display:none!important}

  /* Chọn ngày */
  .datebox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
  .datebox label{display:block;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
  .datebox .row{display:flex;gap:8px;align-items:center}
  .datebox input[type=date]{flex:1;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 12px;
        font-size:17px;font-weight:600;color:var(--text);background:#fff;font-family:inherit;min-width:0}
  .datebox .btn-today{height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#f8fafc;
        color:var(--primary);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .datebox .hint{font-size:13px;margin-top:8px;color:var(--muted)}
  .datebox .hint.old{color:var(--warn);font-weight:600}
  .crumb.old{background:#fde68a;color:#78350f;font-weight:700}
  .msg.info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}

  /* Bảng tổng hợp ca đêm (xem ngày cũ) */
  table.st tr.row-click{cursor:pointer}
  table.st tr.row-click:active td{background:#eef2ff}
  table.st tr.row-click td:first-child::before{content:'▸ ';color:var(--muted)}
  table.st tr.row-click.open td:first-child::before{content:'▾ '}
  table.st tr.detail td{background:#f8fafc;padding:4px 10px 10px 22px;border-top:0}
  table.st tr.detail .dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
  table.st tr.detail .dl b{text-align:right}
  table.st tr.grp.night td{color:var(--primary)}

  /* Chi tiết theo chức vụ (ca đêm) */
  .rblock{border-top:1px solid var(--line)}
  .rblock:first-child{border-top:0}
  .rblock .reason{border-top:0}
  .dpanel{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:6px 10px 10px;margin:0 0 12px}
  .drow{padding:8px 0;border-top:1px dashed var(--line)}
  .drow:first-child{border-top:0}
  .dtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .dtype{font-weight:600;font-size:14px}
  .stepper.sm button{width:38px;height:38px;font-size:20px}
  .stepper.sm input{width:46px;height:38px;font-size:17px}
  .dnote{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .dnote select,.dnote input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;
        font-size:15px;background:#fff;color:var(--text);font-family:inherit}
  .dnote select:focus,.dnote input:focus{outline:2px solid #bfdbfe;border-color:var(--primary-2)}
  .dstatus{font-size:13px;font-weight:600;margin-top:6px;padding:6px 10px;border-radius:8px}
  .dstatus.bad{background:var(--err-bg);color:var(--err)}
  .dstatus.good{background:var(--ok-bg);color:var(--ok)}
  .notebox{white-space:pre-line;font-size:14px;line-height:1.5}
  .notebox.sm{font-size:13px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--text)}
</style>
</head>
<body>

<header id="hdr">
  <h1 id="title">BÁO CÁO TECHNOKOM</h1>
  <div class="date" id="today"></div>
  <div class="crumbs" id="crumbs"></div>
</header>

<main id="app"></main>

<div class="bar hidden" id="bar"><div class="inner" id="barInner"></div></div>

<script>
/* ====== CẤU HÌNH: dán URL Web App của Apps Script vào đây ====== */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby3NJFBmWjy5LRBMQKZ8rD1Px7hGysKdpWuSVgvpUxXywswlHXdzWHpdwUffxlH8cay/exec';
/* =============================================================== */

const $app = document.getElementById('app');
const $bar = document.getElementById('bar');
const $barInner = document.getElementById('barInner');
const $crumbs = document.getElementById('crumbs');
const $hdr = document.getElementById('hdr');
const $title = document.getElementById('title');

document.getElementById('today').textContent =
  new Date().toLocaleDateString('vi-VN', { weekday:'long', day:'2-digit', month:'2-digit', year:'numeric' });

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = arr => arr.reduce((a, b) => a + (Number(b) || 0), 0);
const $ = id => document.getElementById(id);

/* ---------- Ngày ---------- */
// ISO (yyyy-mm-dd, dùng cho ô lịch)  <->  dd-MM-yyyy (tên tab trong Google Sheet)
const pad2 = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const isoToName = iso => { const [y, m, d] = iso.split('-'); return `${d}-${m}-${y}`; };
const SEL = { iso: todayISO() };                       // ngày đang chọn
const selName = () => isoToName(SEL.iso);
const isOldDay = () => SEL.iso !== todayISO();

/* ---------- API ---------- */
async function apiGet(type) {
  const res = await fetch(SCRIPT_URL + '?type=' + type + '&date=' + selName() + '&t=' + Date.now());
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}
async function apiPost(payload) {
  // text/plain để tránh CORS preflight với Apps Script
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

/* ---------- Khung chung ---------- */
function setHeader(mode, crumbs) {
  $hdr.classList.toggle('bread', mode === 'bread');
  $title.textContent = mode === 'night' ? 'BÁO CÁO NHÂN SỰ CA ĐÊM'
                    : mode === 'bread' ? 'BÁO CÁO SUẤT BÁNH MÌ SỮA'
                    : 'BÁO CÁO TECHNOKOM';
  let html = (crumbs || []).map(p => `<span class="crumb">${esc(p)}</span>`).join('');
  if (mode) {
    html = `<span class="crumb">Ngày ${esc(selName())}</span>` +
           (isOldDay() ? `<span class="crumb old">Đang xem ngày cũ</span>` : '') + html;
  }
  $crumbs.innerHTML = html;
}
function showEmpty(mode) {
  setHeader(mode, []);
  $app.innerHTML = `<div class="msg info">Không có dữ liệu ngày <b>${esc(selName())}</b>.</div>`;
  setBar(`<button class="btn ghost" style="flex:1" id="home">← Về trang đầu chọn ngày khác</button>`);
  $('home').onclick = renderHome;
  window.scrollTo(0, 0);
}
function setBar(html) {
  if (!html) { $bar.classList.add('hidden'); $barInner.innerHTML = ''; return; }
  $barInner.innerHTML = html; $bar.classList.remove('hidden');
}
function showLoading(text) {
  setBar('');
  $app.innerHTML = `<div class="center"><div class="spinner"></div>${esc(text)}</div>`;
}
function showError(err, retry) {
  $app.innerHTML = `<div class="msg err">${esc(err.message || err)}</div>
    <button class="btn primary" style="width:100%" id="retry">Thử lại</button>`;
  setBar(`<button class="btn ghost" style="flex:1" id="home">← Về menu chính</button>`);
  $('retry').onclick = retry;
  $('home').onclick = renderHome;
}

/* =====================================================================
 *  MENU CHÍNH
 * ===================================================================== */
function renderHome() {
  setHeader(null, []);
  const max = todayISO();
  if (SEL.iso > max) SEL.iso = max;
  $app.innerHTML = `
    <div class="datebox">
      <label for="dpick">Ngày báo cáo</label>
      <div class="row">
        <input type="date" id="dpick" value="${SEL.iso}" max="${max}">
        <button class="btn-today" id="btnToday">Hôm nay</button>
      </div>
      <div class="hint" id="dhint"></div>
    </div>
    <div class="step-title">Chọn loại báo cáo</div>
    <div class="menu">
      <button class="menu-btn night" id="goNight">
        <div class="ic">🌙</div>
        <div><b>Báo cáo nhân sự ca đêm</b><span>Khai số người nghỉ theo lý do</span></div>
      </button>
      <button class="menu-btn bread" id="goBread">
        <div class="ic">🥖</div>
        <div><b>Báo cáo suất bánh mì sữa</b><span>Khai số suất trước làm thêm ca</span></div>
      </button>
    </div>`;
  setBar('');
  const dp = $('dpick');
  const hint = () => {
    const old = isOldDay();
    $('dhint').className = 'hint' + (old ? ' old' : '');
    $('dhint').textContent = old
      ? `Đang chọn ngày cũ ${selName()} — chỉ xem, không nhập được`
      : `Hôm nay ${selName()} — nhập và gửi báo cáo`;
    $('btnToday').classList.toggle('hidden', !old);
  };
  dp.addEventListener('change', () => {
    let v = dp.value || todayISO();
    if (v > todayISO()) v = todayISO();
    SEL.iso = v; dp.value = v; hint();
  });
  $('btnToday').onclick = () => { SEL.iso = todayISO(); dp.value = SEL.iso; hint(); };
  hint();
  $('goNight').onclick = () => { N.factory = null; N.dept = null; nightLoad(); };
  $('goBread').onclick = () => { B.factory = null; B.dept = null; breadLoad(); };
  window.scrollTo(0, 0);
}

/* =====================================================================
 *  CA ĐÊM
 * ===================================================================== */
const N = { data: null, factory: null, dept: null, inputs: [], saving: false };

function nightCrumbs() {
  const p = [];
  if (N.factory) p.push(N.factory.name);
  if (N.dept) p.push(N.dept.name);
  setHeader('night', p);
}

async function nightLoad() {
  setHeader('night', []);
  showLoading('Đang tải dữ liệu...');
  try {
    N.data = await apiGet('night');
    if (N.data.empty) return showEmpty('night');
    if (N.data.readonly) return nightOverview();
    if (N.factory) N.factory = N.data.factories.find(f => f.name === N.factory.name) || null;
    if (N.dept && N.factory) N.dept = N.factory.departments.find(d => d.name === N.dept.name) || null;
    if (N.dept) return nightForm();
    if (N.factory) return nightDepartments();
    nightFactories();
  } catch (e) {
    showError(e, nightLoad);
  }
}

/* Xem ngày cũ: bảng tổng hợp, bấm 1 dòng để xem 5 lý do */
function nightOverview() {
  setHeader('night', []);
  const f = N.data.factories;
  const reasons = N.data.reasons;
  const all = f.flatMap(x => x.departments);
  const tot = list => ({ total: sum(list.map(d => d.total)), present: sum(list.map(d => d.present)), off: sum(list.map(d => sum(d.values))) });
  const T = tot(all);
  let k = 0;
  $app.innerHTML = `
    <div class="step-title">Tổng hợp nhân sự ca đêm</div>
    <div class="card stats">
      <div><b>${T.total}</b><span>NS hiện có</span></div>
      <div><b>${T.present}</b><span>Đi làm</span></div>
      <div><b>${T.off}</b><span>Tổng nghỉ</span></div>
    </div>
    <table class="st">
      <thead><tr><th>Bộ phận</th><th class="num">NS có</th><th class="num">Đi làm</th><th class="num">Nghỉ</th></tr></thead>
      <tbody>
        ${f.map(x => {
          const t = tot(x.departments);
          return `
          <tr class="grp night"><td>${esc(x.name)}</td><td class="num">${t.total}</td><td class="num">${t.present}</td><td class="num">${t.off}</td></tr>
          ${x.departments.map(d => {
            const id = k++;
            return `
            <tr class="row-click" data-k="${id}">
              <td>${esc(d.name)}</td><td class="num">${d.total}</td><td class="num">${d.present}</td>
              <td class="num">${sum(d.values) || '<span class="muted">0</span>'}</td>
            </tr>
            <tr class="detail hidden" id="dt${id}"><td colspan="4"><div class="dl">
              ${reasons.map((r, i) => `<span>${esc(r)}</span><b>${d.values[i]}</b>`).join('')}
            </div>${d.note ? `<div class="notebox sm">${esc(d.note)}</div>` : ''}</td></tr>`;
          }).join('')}`;
        }).join('')}
        <tr class="tot"><td>Tổng cộng</td><td class="num">${T.total}</td><td class="num">${T.present}</td><td class="num">${T.off}</td></tr>
      </tbody>
    </table>`;
  $app.querySelectorAll('tr.row-click').forEach(tr => tr.onclick = () => {
    tr.classList.toggle('open');
    $('dt' + tr.dataset.k).classList.toggle('hidden');
  });
  setBar(`<button class="btn ghost" id="home">← Trang đầu</button>
          <button class="btn ghost" style="flex:1" id="reload">↻ Tải lại</button>`);
  $('home').onclick = renderHome;
  $('reload').onclick = nightLoad;
  window.scrollTo(0, 0);
}

function nightFactories() {
  N.factory = null; N.dept = null; nightCrumbs();
  const f = N.data.factories;
  $app.innerHTML = `
    <div class="step-title">Bước 1 · Chọn xưởng</div>
    <div class="list">
      ${f.map((x, i) => {
        const absent = sum(x.departments.map(d => sum(d.values)));
        return `<button class="item" data-i="${i}">
          <div>${esc(x.name)}<small>${x.departments.length} bộ phận</small></div>
          <span class="badge ${absent ? 'has' : ''}">${absent} người</span>
        </button>`;
      }).join('')}
    </div>`;
  $app.querySelectorAll('.item').forEach(b => b.onclick = () => {
    N.factory = f[b.dataset.i]; nightDepartments();
  });
  setBar(`<button class="btn ghost" id="home">← Menu</button>
          <button class="btn ghost" style="flex:1" id="reload">↻ Tải lại số liệu</button>`);
  $('home').onclick = renderHome;

/* ---------- Chi tiết theo chức vụ ---------- */
const TYPES = ['Thời vụ', 'Công nhân', 'Sinh viên'];
const NOTE_OPTS = ['Ốm', 'Không liên lạc được', 'Bỏ việc', 'Khác'];

// Chuyển chi tiết đã lưu (cột U) -> trạng thái form
function detailFromSaved(saved, values) {
  return values.map((v, i) => TYPES.map((_, t) => {
    const e = saved && saved[i] && saved[i][t];
    const qty = e ? (e[0] | 0) : 0;
    const note = e ? String(e[1] || '') : '';
    if (!note) return { qty, sel: '', other: '' };
    const preset = NOTE_OPTS.slice(0, -1).includes(note);
    return { qty, sel: preset ? note : 'Khác', other: preset ? '' : note };
  }));
}
// Lý do không cần chọn ghi chú (Nghỉ phép): ghi chú tự điền là tên lý do
const NO_NOTE = { 0: 'Nghỉ phép' };
const noteOf = (r, i) => NO_NOTE[i] || (r.sel === 'Khác' ? r.other.trim() : r.sel);

// Tạo nội dung Ghi chú giống script (để xem trước khi gửi)
function buildNote(det, values) {
  return TYPES.map((type, t) => {
    const groups = [];
    values.forEach((v, i) => {
      if (!v) return;
      const r = det[i][t];
      if (!r.qty) return;
      const note = noteOf(r, i);
      const g = groups.find(x => x.key === note.toLowerCase());
      if (g) g.n += r.qty; else groups.push({ key: note.toLowerCase(), note, n: r.qty });
    });
    if (!groups.length) return '';
    const total = sum(groups.map(g => g.n));
    const inner = groups.length === 1 ? groups[0].note : groups.map(g => g.n + ' ' + g.note).join(', ');
    return `+ ${total} ${type} (${inner})`;
  }).filter(Boolean).join('\n');
}

// Lỗi của 1 lý do (null = hợp lệ)
function detailError(i) {
  const v = N.inputs[i];
  if (!v) return null;
  const rows = N.details[i];
  const s = sum(rows.map(r => r.qty));
  if (s !== v) return `Đã chia ${s}/${v} người — tổng 3 dòng phải bằng ${v}`;
  for (let t = 0; t < TYPES.length; t++) {
    const r = rows[t];
    if (NO_NOTE[i]) continue;
    if (r.qty > 0 && !r.sel) return `Chưa chọn ghi chú cho ${TYPES[t]}`;
    if (r.qty > 0 && r.sel === 'Khác' && !r.other.trim()) return `Chưa gõ ghi chú "Khác" cho ${TYPES[t]}`;
  }
  return null;
}

function nightForm() {
  nightCrumbs();
  const d = N.dept;
  const reasons = N.data.reasons;
  N.inputs = d.values.slice();
  N.details = detailFromSaved(d.detail, d.values);

  $app.innerHTML = `
    <div class="step-title">Bước 3 · Nhập số người nghỉ theo lý do</div>
    <div class="card stats">
      <div><b>${d.total}</b><span>NS hiện có</span></div>
      <div><b>${d.present}</b><span>Đi làm</span></div>
      <div><b>${sum(d.values)}</b><span>Đã báo nghỉ</span></div>
    </div>
    <div id="warn"></div>
    <div class="card">
      ${reasons.map((r, i) => `
        <div class="rblock">
          <div class="reason">
            <label for="in${i}">${esc(r)}
              <span class="cur" id="cur${i}">Hiện tại: ${d.values[i]}</span>
            </label>
            <div class="stepper">
              <button type="button" class="rstep" data-i="${i}" data-d="-1" aria-label="Giảm">−</button>
              <input id="in${i}" class="rin" data-i="${i}" type="text" inputmode="numeric" pattern="[0-9]*"
                     autocomplete="off" value="${d.values[i]}">
              <button type="button" class="rstep" data-i="${i}" data-d="1" aria-label="Tăng">+</button>
            </div>
          </div>
          <div class="dpanel hidden" id="dp${i}"></div>
        </div>`).join('')}
      <div class="sum"><span>Tổng số người</span><span id="total">${sum(d.values)}</span></div>
    </div>`;

  $app.querySelectorAll('.rstep').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    nightSet(i, (N.inputs[i] || 0) + (+b.dataset.d));
  });
  $app.querySelectorAll('.rin').forEach(inp => {
    inp.addEventListener('focus', () => inp.select());
    inp.addEventListener('input', () => {
      const digits = inp.value.replace(/\D/g, '').slice(0, 3);
      inp.value = digits;
      onReasonChange(+inp.dataset.i, digits === '' ? 0 : parseInt(digits, 10));
    });
    inp.addEventListener('blur', () => { inp.value = N.inputs[+inp.dataset.i]; });
  });

  reasons.forEach((_, i) => renderPanel(i));
  setBar(`<button class="btn ghost" id="back">←</button>
          <button class="btn primary" id="send">Gửi báo cáo</button>`);
  $('back').onclick = nightDepartments;
  $('send').onclick = nightSubmit;
  nightRefresh();
  window.scrollTo(0, 0);
}

function nightSet(i, v) {
  v = Math.max(0, Math.min(999, v | 0));
  $('in' + i).value = v;
  onReasonChange(i, v);
}

function onReasonChange(i, v) {
  const was = N.inputs[i];
  N.inputs[i] = v;
  if (!v) N.details[i] = TYPES.map(() => ({ qty: 0, sel: '', other: '' }));
  // Chỉ có 1 dòng đang dùng -> tự cập nhật theo số mới cho nhanh
  const used = N.details[i].filter(r => r.qty > 0);
  if (v && used.length === 1 && used[0].qty === was) used[0].qty = v;
  renderPanel(i);
  nightRefresh();
}

// Vẽ 3 dòng chi tiết của lý do i
function renderPanel(i) {
  const p = $('dp' + i);
  const v = N.inputs[i];
  if (!v) { p.classList.add('hidden'); p.innerHTML = ''; return; }
  p.classList.remove('hidden');
  p.innerHTML = `
    ${TYPES.map((type, t) => {
      const r = N.details[i][t];
      return `
      <div class="drow" data-i="${i}" data-t="${t}">
        <div class="dtop">
          <span class="dtype">${esc(type)}</span>
          <div class="stepper sm">
            <button type="button" class="dstep" data-d="-1" aria-label="Giảm">−</button>
            <input class="dqty" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${r.qty}">
            <button type="button" class="dstep" data-d="1" aria-label="Tăng">+</button>
          </div>
        </div>
        <div class="dnote ${r.qty && !NO_NOTE[i] ? '' : 'hidden'}">
          <select class="dsel">
            <option value="">— Chọn ghi chú —</option>
            ${NOTE_OPTS.map(o => `<option ${r.sel === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
          </select>
          <input class="dother ${r.sel === 'Khác' ? '' : 'hidden'}" type="text" maxlength="100"
                 placeholder="Gõ ghi chú..." value="${esc(r.other)}">
        </div>
      </div>`;
    }).join('')}
    <div class="dstatus" id="ds${i}"></div>`;

  p.querySelectorAll('.drow').forEach(row => {
    const t = +row.dataset.t;
    const r = N.details[i][t];
    const q = row.querySelector('.dqty');
    const setQ = n => {
      n = Math.max(0, Math.min(v, n | 0));
      r.qty = n; q.value = n;
      row.querySelector('.dnote').classList.toggle('hidden', !n || !!NO_NOTE[i]);
      panelStatus(i);
    };
    row.querySelectorAll('.dstep').forEach(b => b.onclick = () => setQ(r.qty + (+b.dataset.d)));
    q.addEventListener('focus', () => q.select());
    q.addEventListener('input', () => {
      const digits = q.value.replace(/\D/g, '').slice(0, 3);
      const n = digits === '' ? 0 : parseInt(digits, 10);
      r.qty = Math.min(n, v);
      q.value = digits === '' ? '' : r.qty;
      row.querySelector('.dnote').classList.toggle('hidden', !r.qty || !!NO_NOTE[i]);
      panelStatus(i);
    });
    q.addEventListener('blur', () => { q.value = r.qty; });
    const sel = row.querySelector('.dsel'), oth = row.querySelector('.dother');
    sel.onchange = () => {
      r.sel = sel.value;
      oth.classList.toggle('hidden', r.sel !== 'Khác');
      if (r.sel === 'Khác') oth.focus();
      panelStatus(i);
    };
    oth.addEventListener('input', () => { r.other = oth.value; panelStatus(i); });
  });
  panelStatus(i);
}

function panelStatus(i) {
  const el = $('ds' + i);
  if (!el) return;
  const err = detailError(i);
  el.className = 'dstatus ' + (err ? 'bad' : 'good');
  el.textContent = err || `✓ Đã chia đủ ${N.inputs[i]} người`;
}

function nightRefresh() {
  const d = N.dept;
  const total = sum(N.inputs);
  $('total').textContent = total;
  N.inputs.forEach((v, i) => $('cur' + i).classList.toggle('changed', v !== d.values[i]));
  $('warn').innerHTML = total > d.total
    ? `<div class="msg warn">Tổng số người (${total}) lớn hơn nhân sự hiện có (${d.total}). Vui lòng kiểm tra lại.</div>`
    : '';
}

async function nightSubmit() {
  if (N.saving) return;
  const d = N.dept;
  const reasons = N.data.reasons;

  // Kiểm tra chi tiết
  for (let i = 0; i < reasons.length; i++) {
    const err = detailError(i);
    if (err) {
      alert(`${reasons[i]}: ${err}`);
      $('dp' + i).scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
  }

  const total = sum(N.inputs);
  const note = buildNote(N.details, N.inputs);
  const lines = reasons.map((r, i) => `• ${r}: ${N.inputs[i]}`).join('\n');
  let msg = `Gửi báo cáo cho ${N.factory.name} - ${d.name}?\n\n${lines}\n\nTổng: ${total} người`;
  if (note) msg += `\n\nGhi chú:\n${note}`;
  if (sum(d.values) > 0) msg += `\n\n(Số liệu cũ sẽ bị ghi đè)`;
  if (total > d.total) msg += `\n\n⚠ Tổng lớn hơn NS hiện có (${d.total})`;
  if (!confirm(msg)) return;

  const details = N.inputs.map((v, i) => N.details[i].map(r => ({ qty: v ? r.qty : 0, note: v && r.qty ? noteOf(r, i) : '' })));

  N.saving = true;
  const btn = $('send');
  btn.disabled = true; btn.textContent = 'Đang gửi...';
  try {
    const updated = await apiPost({ type: 'night', date: selName(), factory: N.factory.name, department: d.name, values: N.inputs, details });
    const idx = N.factory.departments.findIndex(x => x.name === d.name);
    if (idx >= 0 && updated) N.factory.departments[idx] = updated;
    nightDone(updated || d);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Gửi báo cáo';
    alert('Gửi không thành công:\n' + (e.message || e));
  } finally {
    N.saving = false;
  }
}

function nightDone(d) {
  const reasons = N.data.reasons;
  const time = new Date().toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit' });
  $app.innerHTML = `
    <div class="done">
      <div class="tick">✓</div>
      <h2>Đã gửi thành công</h2>
      <p>${esc(N.factory.name)} · ${esc(d.name)} · ${time}</p>
    </div>
    <div class="card">
      ${reasons.map((r, i) => `<div class="reason"><span>${esc(r)}</span><b>${d.values[i]}</b></div>`).join('')}
      <div class="sum"><span>Tổng số người</span><span>${sum(d.values)}</span></div>
    </div>
    ${d.note ? `<div class="card"><div class="step-title" style="margin:0 0 6px">Ghi chú</div><div class="notebox">${esc(d.note)}</div></div>` : ''}
    <div class="card stats">
      <div><b>${d.total}</b><span>NS hiện có</span></div>
      <div><b>${d.present}</b><span>Đi làm</span></div>
      <div><b>${d.absent}</b><span>Nghỉ trong ngày</span></div>
    </div>`;
  setBar(`<button class="btn ghost" id="home">Về đầu</button>
          <button class="btn primary" id="other">Bộ phận khác</button>`);
  $('home').onclick = nightFactories;
  $('other').onclick = nightDepartments;
  window.scrollTo(0, 0);
}

/* =====================================================================
 *  BÁNH MÌ SỮA
 * ===================================================================== */
const B = { data: null, factory: null, dept: null, input: null, saving: false };

function breadCrumbs() {
  const p = [];
  if (B.factory) p.push(B.factory.name);
  if (B.dept) p.push(B.dept.name);
  setHeader('bread', p);
}

function applyBreadData(data) {
  B.data = data;
  if (B.factory) B.factory = data.factories.find(f => f.name === B.factory.name) || null;
  if (B.dept && B.factory) B.dept = B.factory.departments.find(d => d.name === B.dept.name) || null;
}

async function breadLoad() {
  setHeader('bread', []);
  showLoading('Đang tải dữ liệu...');
  try {
    const data = await apiGet('bread');
    if (data.empty) return showEmpty('bread');
    applyBreadData(data);
    if (data.readonly) return breadReadonly();
    if (B.dept) return breadForm();
    if (B.factory) return breadDepartments();
    breadFactories();
  } catch (e) {
    showError(e, breadLoad);
  }
}

const deptsOf = f => f.departments;
const declaredCount = list => list.filter(d => d.declared).length;
const qtySum = list => sum(list.filter(d => d.declared).map(d => d.value));

/* Bước 1: chọn nhà máy + bảng tình hình khai báo */
function breadFactories() {
  B.factory = null; B.dept = null; breadCrumbs();
  const f = B.data.factories;
  $app.innerHTML = `
    <div class="step-title">Bước 1 · Chọn nhà máy</div>
    <div class="list">
      ${f.map((x, i) => {
        const done = declaredCount(x.departments), all = x.departments.length;
        return `<button class="item" data-i="${i}">
          <div>${esc(x.name)}<small>Đã khai ${done}/${all} bộ phận · ${qtySum(x.departments)} suất</small></div>
          <span class="badge ${done === all ? 'ok' : done ? 'has' : 'no'}">${done === all ? 'Đủ' : 'Thiếu ' + (all - done)}</span>
        </button>`;
      }).join('')}
    </div>
    ${breadStatusTable()}`;
  $app.querySelectorAll('.item').forEach(b => b.onclick = () => {
    B.factory = f[b.dataset.i]; breadDepartments();
  });
  setBar(`<button class="btn ghost" id="home">← Menu</button>
          <button class="btn ghost" style="flex:1" id="reload">↻ Tải lại</button>`);
  $('home').onclick = renderHome;
  $('reload').onclick = breadLoad;
  window.scrollTo(0, 0);
}

/* Xem ngày cũ: chỉ hiện bảng tình hình khai báo */
function breadReadonly() {
  B.factory = null; B.dept = null; breadCrumbs();
  const all = B.data.factories.flatMap(deptsOf);
  $app.innerHTML = `
    <div class="card stats">
      <div><b>${qtySum(all)}</b><span>Tổng suất</span></div>
      <div><b>${declaredCount(all)}/${all.length}</b><span>Bộ phận đã khai</span></div>
      <div><b>${all.length - declaredCount(all)}</b><span>Chưa khai</span></div>
    </div>
    ${breadStatusTable()}`;
  setBar(`<button class="btn ghost" id="home">← Trang đầu</button>
          <button class="btn ghost" style="flex:1" id="reload">↻ Tải lại</button>`);
  $('home').onclick = renderHome;
  $('reload').onclick = breadLoad;
  window.scrollTo(0, 0);
}

function breadStatusTable() {
  const f = B.data.factories;
  const all = f.flatMap(deptsOf);
  const done = declaredCount(all);
  const pct = all.length ? Math.round(done / all.length * 100) : 0;
  return `
    <div class="status-head">
      <div class="step-title">Tình hình khai báo</div>
      <small>Đã khai <b>${done}/${all.length}</b> bộ phận</small>
    </div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <table class="st">
      <thead><tr><th>Bộ phận</th><th class="c">Trạng thái</th><th class="num">Số suất</th><th class="num">Giờ khai</th></tr></thead>
      <tbody>
        ${f.map(x => `
          <tr class="grp"><td colspan="2">${esc(x.name)}</td>
            <td class="num">${qtySum(x.departments)}</td>
            <td class="num">${declaredCount(x.departments)}/${x.departments.length}</td></tr>
          ${x.departments.map(d => `
            <tr>
              <td>${esc(d.name)}</td>
              <td class="c"><span class="pill ${d.declared ? 'ok' : 'no'}">${d.declared ? '✓ Đã khai' : '✗ Chưa khai'}</span></td>
              <td class="num ${d.declared ? '' : 'muted'}">${d.declared ? d.value : '—'}</td>
              <td class="num muted">${d.declared ? esc(d.time) : '—'}</td>
            </tr>`).join('')}
        `).join('')}
        <tr class="tot"><td colspan="2">Tổng cộng</td><td class="num">${qtySum(all)}</td><td class="num">${done}/${all.length}</td></tr>
      </tbody>
    </table>`;
}

/* Bước 2a: chọn bộ phận */
function breadDepartments() {
  B.dept = null; breadCrumbs();
  const d = B.factory.departments;
  $app.innerHTML = `
    <div class="step-title">Bước 2 · Chọn bộ phận</div>
    <div class="list">
      ${d.map((x, i) => `<button class="item" data-i="${i}">
          <div>${esc(x.name)}<small>${x.declared ? 'Khai lúc ' + esc(x.time) : 'Chưa khai'}</small></div>
          <span class="badge ${x.declared ? 'ok' : 'no'}">${x.declared ? x.value + ' suất' : 'Chưa khai'}</span>
        </button>`).join('')}
    </div>`;
  $app.querySelectorAll('.item').forEach(b => b.onclick = () => {
    B.dept = d[b.dataset.i]; breadForm();
  });
  setBar(`<button class="btn ghost" style="flex:1" id="back">← Chọn lại nhà máy</button>`);
  $('back').onclick = breadFactories;
  window.scrollTo(0, 0);
}

/* Bước 2b: nhập số suất */
function breadForm() {
  breadCrumbs();
  const d = B.dept;
  B.input = d.declared ? d.value : null;
  $app.innerHTML = `
    <div class="step-title">Bước 2 · Nhập số suất bánh mì sữa</div>
    <div class="card">
      <div class="bread-input">
        <div class="lbl">${esc(B.factory.name)} · ${esc(d.name)}</div>
        <div class="stepper big">
          <button type="button" id="dec" aria-label="Giảm">−</button>
          <input id="qty" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off"
                 placeholder="0" value="${d.declared ? d.value : ''}">
          <button type="button" id="inc" aria-label="Tăng">+</button>
        </div>
        <div class="cur">${d.declared ? `Đã khai: <b>${d.value}</b> suất lúc ${esc(d.time)} — gửi lại sẽ ghi đè` : 'Chưa khai hôm nay'}</div>
      </div>
    </div>`;

  const inp = $('qty');
  const setQty = v => {
    v = Math.max(0, Math.min(9999, v | 0));
    B.input = v; inp.value = v; breadValidate();
  };
  $('dec').onclick = () => setQty((B.input || 0) - 1);
  $('inc').onclick = () => setQty((B.input || 0) + 1);
  inp.addEventListener('focus', () => inp.select());
  inp.addEventListener('input', () => {
    const digits = inp.value.replace(/\D/g, '').slice(0, 4);
    inp.value = digits;
    B.input = digits === '' ? null : parseInt(digits, 10);
    breadValidate();
  });

  setBar(`<button class="btn ghost" id="back">←</button>
          <button class="btn primary bread" id="send">Gửi báo cáo</button>`);
  $('back').onclick = breadDepartments;
  $('send').onclick = breadSubmit;
  breadValidate();
  window.scrollTo(0, 0);
  if (!d.declared) setTimeout(() => inp.focus(), 200);
}

function breadValidate() {
  const btn = $('send');
  if (btn) btn.disabled = B.input === null;
}

async function breadSubmit() {
  if (B.saving || B.input === null) return;
  const d = B.dept;
  let msg = `Gửi báo cáo suất bánh mì sữa?\n\n${B.factory.name} - ${d.name}\nSố suất: ${B.input}`;
  if (d.declared) msg += `\n\n(Ghi đè số cũ: ${d.value} suất)`;
  if (!confirm(msg)) return;

  B.saving = true;
  const btn = $('send');
  btn.disabled = true; btn.textContent = 'Đang gửi...';
  try {
    const data = await apiPost({ type: 'bread', date: selName(), factory: B.factory.name, department: d.name, value: B.input });
    applyBreadData(data);
    breadDone();
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Gửi báo cáo';
    alert('Gửi không thành công:\n' + (e.message || e));
  } finally {
    B.saving = false;
  }
}

function breadDone() {
  breadCrumbs();
  const d = B.dept;
  $app.innerHTML = `
    <div class="done">
      <div class="tick">✓</div>
      <h2>Đã gửi thành công</h2>
      <p>${esc(B.factory.name)} · ${esc(d.name)} · ${esc(d.time)}</p>
    </div>
    <div class="card stats">
      <div><b>${d.value}</b><span>Suất đã khai</span></div>
      <div><b>${declaredCount(B.factory.departments)}/${B.factory.departments.length}</b><span>Bộ phận đã khai</span></div>
      <div><b>${qtySum(B.factory.departments)}</b><span>Tổng suất ${esc(B.factory.name)}</span></div>
    </div>
    ${breadStatusTable()}`;
  B.dept = null;
  setBar(`<button class="btn ghost" id="home">Về đầu</button>
          <button class="btn primary bread" id="other">Bộ phận khác</button>`);
  $('home').onclick = breadFactories;
  $('other').onclick = breadDepartments;
  window.scrollTo(0, 0);
}

renderHome();
</script>
</body>
</html>
